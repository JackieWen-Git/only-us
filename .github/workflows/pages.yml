name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair and decode index.html.gz.b64
        run: |
          python3 - <<'PY'
          import base64, gzip
          from pathlib import Path
          b64 = list(Path('index.html.gz.b64').read_text().strip())
          # Repair known transcription corruptions from a prior push
          for i, ch in [(886, '6'), (3082, '7'), (9189, 'R'), (10935, 'T')]:
              b64[i] = ch
          html = gzip.decompress(base64.b64decode(''.join(b64)))
          Path('index.html').write_bytes(html)
          text = html.decode('utf-8')
          assert '只想和你' in text and '🐷妮' in text and '正在为你匹配' in text
          print('decoded', len(html), 'bytes OK')
          PY
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
