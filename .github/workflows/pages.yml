name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode index.html from gzip+base64 payload
        run: |
          python3 - <<'PY'
          import base64, gzip
          from pathlib import Path
          b64 = Path('index.html.gz.b64').read_text().strip()
          Path('index.html').write_bytes(gzip.decompress(base64.b64decode(b64)))
          print('decoded', Path('index.html').stat().st_size, 'bytes')
          PY
          test -f index.html
          grep -q '只想和你' index.html
          grep -q '🐷妮' index.html
          grep -q '正在为你匹配' index.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
